[package]
name = "kuina"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "process", "signal", "sync", "rt-multi-thread"] }
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
